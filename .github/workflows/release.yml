name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Pin Maven 3.9.9 (Tycho 4.0.10 breaks on newer Maven)
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-3.9.9/bin/mvn" -v
          "$RUNNER_TEMP/apache-maven-3.9.9/bin/mvn" -v
      - name: Build and test
        run: |
          scripts/fetch-dbeaver.sh 24.1.0
          mvn -B clean verify
      - name: GitHub release with the offline zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" releng/update-site/target/kastor-dbeaver-ai-chat-v*.zip --generate-notes --title "Kastor ${GITHUB_REF_NAME}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: releng/update-site/target/repository
      - id: deploy
        uses: actions/deploy-pages@v4
